keys:
  # --- Admin / Recovery Keys ---
  - &master       "age1jxg7esut03as8rc4yn2ql3zusfgshfg2vhhyem5tc3a9t0jlw4qqqlt5f5"

  # --- Machine Host Keys ---
  # Live USB
  - &nixos_btw    "age1xpzytgl37lrwtn4a67cja7jccjtwtu3gfzusdtp23hu54hdlrqaqlexk88"
  
  - &laptop       "age1n4ufupjsxq2tw22nlknl4xyynlfey76nqqs8vuukxe7ygj49sshqzkc9yz"

creation_rules:
  # 1. Common secrets
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *master
          - *nixos_btw
          - *laptop

  # 2. Host secrets (Shared by both hosts until you split them)
  - path_regex: secrets/hosts/nixos-btw\.yaml$
    key_groups:
      - age:
          - *master
          - *nixos_btw
          - *laptop

  # 3. GCal OAuth token
  - path_regex: secrets/hosts/gcalcli_oauth\.enc$
    key_groups:
      - age:
          - *master
          - *nixos_btw
          - *laptop
